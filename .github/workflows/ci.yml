name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build
        run: forge build
        working-directory: contracts
      - name: Test
        run: forge test -vvv
        working-directory: contracts
      - name: Format check
        run: forge fmt --check
        working-directory: contracts

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter demo lint
      - name: Typecheck + build
        run: pnpm --filter demo build
        env:
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci-placeholder

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter api run lint
      - name: Typecheck + build
        run: pnpm --filter api run build

  indexer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Codegen
        run: pnpm --filter indexer run codegen
      - name: Typecheck
        run: pnpm --filter indexer exec tsc --noEmit
      - name: Test
        run: pnpm --filter indexer test

  testnet-deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [contracts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Deploy Slice 1 + Slice 2 to Sepolia
        working-directory: contracts
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          echo "Deploy scripts are skeletons until contracts land — see docs/roadmap.md"
          # forge script script/DeployV2Sepolia.s.sol --rpc-url sepolia --broadcast --verify
          # forge script script/DeployV1Sepolia.s.sol --rpc-url sepolia --broadcast --verify
