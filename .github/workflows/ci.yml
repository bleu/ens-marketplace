name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build
        run: forge build
        working-directory: contracts
      - name: Test
        run: forge test -vvv
        working-directory: contracts
      - name: Format check
        run: forge fmt --check
        working-directory: contracts

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter web lint
      - name: Typecheck + build
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci-placeholder

  # Re-enabled: this job was commented out because navigation.cy.ts and ensv1-explore.cy.ts
  # both failed against the "landing page when disconnected" change. Both are fixed here —
  # `/` redirects unconditionally again, and ENSv1 is the default mode, which is what those
  # two specs were written for.
  #
  # No chain and no backend any more either. This job used to start Anvil, deploy
  # DeployLocal.s.sol, and bring up the indexer + apps/api + a Postgres, all so the ENSv2
  # write-flow specs could make real transactions against a local chain. The app no longer
  # supports a local chain, so those specs are gone, and every surviving spec is read-only
  # and stubs at the /api/ensv1/* boundary with cy.intercept.
  e2e:
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Ensure the Cypress binary is installed
        run: pnpm --filter web exec cypress install
      - name: Build + run Cypress against a production build
        run: pnpm --filter web e2e
        env:
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci-placeholder
      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: apps/web/cypress/screenshots

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter api run lint
      - name: Typecheck + build
        run: pnpm --filter api run build

  # Rebuilds apps/api on bleu-generic-1 (the shared prod server) and restarts just the
  # `api` service — api-postgres keeps running via its own `restart: unless-stopped`.
  # The server isn't a git clone (no GitHub access from that host), so each run wipes
  # the working copy and re-extracts a fresh tarball of this checkout rather than
  # trying to reconcile a diff — the one thing preserved across runs is deploy/.env
  # (real secrets, never committed). BLEU_GENERIC_SSH_KEY is a deploy-only keypair
  # (not anyone's personal key) added just for this job.
  deploy-backend:
    needs: [api]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package repo
        run: tar czf /tmp/ens-marketplace-deploy.tar.gz --exclude=.git .
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.BLEU_GENERIC_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.BLEU_GENERIC_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Sync + rebuild api on bleu-generic-1
        run: |
          scp -i ~/.ssh/deploy_key /tmp/ens-marketplace-deploy.tar.gz bleu@46.62.129.119:/tmp/ens-marketplace-deploy.tar.gz
          ssh -i ~/.ssh/deploy_key bleu@46.62.129.119 '
            set -e
            cd ~/ens-marketplace
            cp deploy/.env /tmp/ens-marketplace-deploy.env.bak
            find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            tar xzf /tmp/ens-marketplace-deploy.tar.gz
            rm /tmp/ens-marketplace-deploy.tar.gz
            mkdir -p deploy
            mv /tmp/ens-marketplace-deploy.env.bak deploy/.env
            docker compose -f deploy/docker-compose.yml --env-file deploy/.env build api
            docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d api
          '

  testnet-deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [contracts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Deploy Slice 1 + Slice 2 to Sepolia
        working-directory: contracts
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          # DeployV1Sepolia.s.sol (RenewalRouter) is still a skeleton — see docs/slice-2.md.
          # Left commented until it's actually implemented and auto-redeploy-per-tag is the
          # intended workflow.
          echo "No auto-deploy wired up yet — see comments in this step for why."
          # forge script script/DeployV1Sepolia.s.sol --rpc-url sepolia --broadcast --verify
