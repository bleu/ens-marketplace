name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build
        run: forge build
        working-directory: contracts
      - name: Test
        run: forge test -vvv
        working-directory: contracts
      - name: Format check
        run: forge fmt --check
        working-directory: contracts

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter demo lint
      - name: Typecheck + build
        run: pnpm --filter demo build
        env:
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci-placeholder

  e2e:
    needs: [frontend]
    runs-on: ubuntu-latest
    # No chain and no backend here any more. This job used to start Anvil, deploy
    # DeployLocal.s.sol, and bring up the indexer + apps/api + a Postgres, all so the ENSv2
    # write-flow specs could make real transactions against a local chain. The app no longer
    # supports a local chain, so those specs are gone, and every surviving spec is read-only
    # and stubs at the /api/ensv1/* boundary with cy.intercept.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build + run Cypress against a production build
        run: pnpm --filter demo e2e
        env:
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci-placeholder
      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: apps/demo/cypress/screenshots

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter api run lint
      - name: Typecheck + build
        run: pnpm --filter api run build

  indexer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Codegen
        run: pnpm --filter indexer run codegen
      - name: Typecheck
        run: pnpm --filter indexer exec tsc --noEmit
      - name: Test
        run: pnpm --filter indexer test

  testnet-deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [contracts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Deploy Slice 1 + Slice 2 to Sepolia
        working-directory: contracts
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          # DeployV2Sepolia.s.sol is implemented and already deployed manually — see the
          # addresses in the root README.md. Left commented (rather than wired up here)
          # since running it again would deploy a fresh instance and immediately
          # invalidate those README addresses; re-enable deliberately, together with a
          # README update, once auto-redeploy-per-tag is actually the intended workflow.
          # DeployV1Sepolia.s.sol (RenewalRouter) is still a skeleton — see docs/poc-slice-2.md.
          echo "No auto-deploy wired up yet — see comments in this step for why."
          # forge script script/DeployV2Sepolia.s.sol --rpc-url sepolia --broadcast --verify
          # forge script script/DeployV1Sepolia.s.sol --rpc-url sepolia --broadcast --verify
