name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build
        run: forge build
        working-directory: contracts
      - name: Test
        run: forge test -vvv
        working-directory: contracts
      - name: Format check
        run: forge fmt --check
        working-directory: contracts

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter demo lint
      - name: Typecheck + build
        run: pnpm --filter demo build
        env:
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci-placeholder

