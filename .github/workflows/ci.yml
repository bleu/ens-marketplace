name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build
        run: forge build
        working-directory: contracts
      - name: Test
        run: forge test -vvv
        working-directory: contracts
      - name: Format check
        run: forge fmt --check
        working-directory: contracts

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter demo lint
      - name: Typecheck + build
        run: pnpm --filter demo build
        env:
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci-placeholder

  e2e:
    needs: [frontend]
    runs-on: ubuntu-latest
    # apps/demo's /domains and /subnames pages read from apps/api, which reads from the
    # Envio indexer (apps/indexer) — this Postgres backs apps/api's own Grails database
    # (PrismaService.$connect() needs a reachable DB just to start, even though no Grails
    # endpoint is exercised here). The indexer's own Postgres+Hasura are separate — Envio
    # spins those up itself via Docker (already available on this runner) when it starts.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # actions/setup-node's pnpm cache only covers pnpm's own store, not Cypress's
      # separate binary cache (~/.cache/Cypress) — a pnpm-store cache hit can skip
      # re-running cypress's postinstall entirely, silently leaving the binary missing
      # ("The cypress npm package is installed, but the Cypress binary is missing").
      # This is a no-op if the binary's already present, so it's safe every run.
      - name: Ensure the Cypress binary is installed
        run: pnpm --filter demo exec cypress install
      - name: Start Anvil + deploy local demo contracts
        working-directory: contracts
        run: |
          anvil > /tmp/anvil.log 2>&1 &
          npx --yes wait-port 127.0.0.1:8545
          forge script script/DeployLocal.s.sol --rpc-url http://127.0.0.1:8545 --broadcast
      - name: Start the ENSv2 indexer (Envio HyperIndex)
        working-directory: apps/indexer
        run: |
          pnpm dev > /tmp/indexer.log 2>&1 &
          npx --yes wait-port 127.0.0.1:8080
      - name: Start apps/api
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          pnpm exec prisma migrate deploy
          pnpm run build
          pnpm run start > /tmp/api.log 2>&1 &
          npx --yes wait-port 127.0.0.1:3001
      - name: Build + run Cypress against a production build
        run: pnpm --filter demo e2e
        env:
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci-placeholder
          DOMAINS_API_URL: http://localhost:3001
      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: apps/demo/cypress/screenshots
      - name: Upload indexer/api logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: |
            /tmp/indexer.log
            /tmp/api.log

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter api run lint
      - name: Typecheck + build
        run: pnpm --filter api run build

  indexer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Codegen
        run: pnpm --filter indexer run codegen
      - name: Typecheck
        run: pnpm --filter indexer exec tsc --noEmit
      - name: Test
        run: pnpm --filter indexer test

  testnet-deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [contracts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Deploy Slice 1 + Slice 2 to Sepolia
        working-directory: contracts
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          # DeployV2Sepolia.s.sol is implemented and already deployed manually — see the
          # addresses in the root README.md. Left commented (rather than wired up here)
          # since running it again would deploy a fresh instance and immediately
          # invalidate those README addresses; re-enable deliberately, together with a
          # README update, once auto-redeploy-per-tag is actually the intended workflow.
          # DeployV1Sepolia.s.sol (RenewalRouter) is still a skeleton — see docs/poc-slice-2.md.
          echo "No auto-deploy wired up yet — see comments in this step for why."
          # forge script script/DeployV2Sepolia.s.sol --rpc-url sepolia --broadcast --verify
          # forge script script/DeployV1Sepolia.s.sol --rpc-url sepolia --broadcast --verify
