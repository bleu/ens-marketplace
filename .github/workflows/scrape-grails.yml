name: scrape-grails
on:
  schedule:
    # Every 6 hours, for as long as Grails' own API stays reachable — see
    # docs/grails-migration.md for why this exists and what happens once it isn't.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        # apps/api's own postinstall runs `prisma generate` automatically — no separate
        # step needed. `prisma generate` doesn't connect to the DB (just reads the schema
        # file), so DATABASE_URL isn't required for this step, only the scrape step below.
        run: pnpm install --frozen-lockfile
      - name: Scrape Grails listings
        run: pnpm --filter api run scrape:grails
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
