# Production deployment for apps/api (Grails/ENSv1 backend). apps/web (the Next.js
# frontend) is deployed separately, to Vercel. Run from the repo root:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# Only `api` is published to the host — Caddy reverse-proxies to it. `api-postgres`
# talks over this compose's own internal network only, by service name — never
# reachable from outside this host.
name: ens-marketplace
services:
  api-postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${API_PG_USER:-postgres}
      POSTGRES_PASSWORD: ${API_PG_PASSWORD:?error}
      POSTGRES_DB: ${API_PG_DATABASE:-ens_marketplace_api}
    volumes:
      - api-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${API_PG_USER:-postgres} -d ${API_PG_DATABASE:-ens_marketplace_api}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ens-marketplace-api:${APP_REVISION:-latest}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      api-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${API_PG_USER:-postgres}:${API_PG_PASSWORD:?error}@api-postgres:5432/${API_PG_DATABASE:-ens_marketplace_api}
      PORT: 3001
    command: sh -c "pnpm exec prisma migrate deploy && pnpm run start"
    ports:
      - "${API_EXPOSED_PORT:-41000}:3001"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  api-postgres-data:
    name: ens-marketplace-api-postgres-data
